name: Go package

on:
  pull_request:
  push:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: storage-lock-http-api

      # 兄弟仓库未发布本仓库依赖的新 API，用本地 replace 指向平级目录：
      # go-storage-lock（新的跨进程 Subscribe/WatchDog 语义）+ go-events（新语义事件类型）
      - name: Checkout go-storage-lock
        uses: actions/checkout@v4
        with:
          repository: storage-lock/go-storage-lock
          path: go-storage-lock

      - name: Checkout go-events
        uses: actions/checkout@v4
        with:
          repository: storage-lock/go-events
          path: go-events

      # 跨语言测试（TestCrossLanguageClients）需要 python/java 客户端库，
      # 位于仓库平级目录（测试用 ../.. 相对路径定位）
      - name: Checkout python-storage-lock
        uses: actions/checkout@v4
        with:
          repository: storage-lock/python-storage-lock
          path: python-storage-lock

      - name: Checkout java-storage-lock
        uses: actions/checkout@v4
        with:
          repository: storage-lock/java-storage-lock
          path: java-storage-lock

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        working-directory: storage-lock-http-api
        run: go build ./...

      - name: Vet
        working-directory: storage-lock-http-api
        run: go vet ./...

      - name: Test
        working-directory: storage-lock-http-api
        run: go test -race ./...
