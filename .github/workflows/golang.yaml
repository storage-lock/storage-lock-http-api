name: Go package

on:
  pull_request:
  push:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: storage-lock-http-api

      - name: Prepare published dependencies
        working-directory: storage-lock-http-api
        run: go mod download

      # Cross-language client integration tests skip when the private client repos
      # are not present in the public CI checkout.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        working-directory: storage-lock-http-api
        run: go build ./...

      - name: Vet
        working-directory: storage-lock-http-api
        run: go vet ./...

      - name: Test
        working-directory: storage-lock-http-api
        run: go test -race ./...
